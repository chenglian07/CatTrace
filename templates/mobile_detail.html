<!-- ============================================================
     移动端详情页模板 (mobile_detail.html)
     功能：展示单只猫咪的完整详情信息（独立页面），包含基本信息、
           健康记录、投喂统计，以及投喂和举报异常两个操作按钮
     技术栈：Jinja2 模板 + 原生 JS，通过 URL 参数 id 获取猫咪数据
     API 依赖：/api/cats/{id}（GET 详情）、/api/feed（POST 投喂）、
               /api/report-abuse（POST 举报）
     ============================================================ -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 视口设置：禁止手动缩放，保证移动端原生体验 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猫咪详情 - 猫迹 CatTrace</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ cache_bust }}">
    <meta name="theme-color" content="#d88da3">
    <!-- ==================== 页面内联样式 ==================== -->
    <!-- 详情页专用布局样式，覆盖全局样式中的通用 class -->
    <style>
        /* 详情页头部区域：渐变背景 + 居中大头像 */
        .detail-header {
            position: relative;
            height: 300px;
            background: linear-gradient(135deg, #d88da3, #e8a8b8); /* 品牌粉色渐变 */
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* 猫咪大头像：白色圆形背景，承载 emoji */
        .detail-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
        }
        /* 返回按钮：绝对定位在左上角，半透明白色圆形 */
        .detail-back {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(255,255,255,0.9);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 20px;
            cursor: pointer;
        }
        /* 详情内容区域 */
        .detail-content {
            padding: 20px;
        }
        /* 猫咪名称标题样式 */
        .detail-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        /* 位置信息文本样式 */
        .detail-location {
            color: #666;
            margin-bottom: 20px;
        }
        /* 状态徽章：圆角药丸样式 */
        .detail-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        /* 信息分区卡片：浅灰背景圆角卡片 */
        .detail-section {
            background: #f5f0eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .detail-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }
        /* 信息网格：2 列等宽网格布局 */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        /* 单个信息项：居中排列标签和值 */
        .info-item {
            text-align: center;
        }
        /* 信息标签：灰色小字 */
        .info-label {
            color: #666;
            font-size: 14px;
            margin-bottom: 5px;
        }
        /* 信息值：加粗大字 */
        .info-value {
            font-size: 18px;
            font-weight: bold;
        }
        /* 操作按钮区域：横向等分排列 */
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .action-buttons .btn {
            flex: 1; /* 按钮等宽 */
        }
    </style>
</head>
<body>
    <!-- ==================== 详情页头部区域 ==================== -->
    <!-- 渐变背景 + 居中大头像 + 左上角返回按钮 -->
    <div class="detail-header">
        <!-- 返回按钮：调用 history.back() 返回上一页 -->
        <button class="detail-back" onclick="history.back()">←</button>
        <!-- 猫咪大头像 emoji，id="detailAvatar" 供 JS 动态更新 -->
        <div class="detail-avatar" id="detailAvatar">🐱</div>
    </div>

    <!-- ==================== 详情页内容区域 ==================== -->
    <div class="detail-content">
        <!-- 猫咪名称，id="detailName" 供 JS 动态更新 -->
        <h1 class="detail-name" id="detailName">猫咪名字</h1>
        <!-- 猫咪位置信息，id="detailLocation" 供 JS 动态更新 -->
        <p class="detail-location" id="detailLocation">📍 位置信息</p>
        <!-- 猫咪状态徽章，id="detailStatus" 供 JS 动态设置文本和样式类 -->
        <span class="detail-status" id="detailStatus">状态</span>

        <!-- ==================== 基本信息分区 ==================== -->
        <!-- 展示猫咪的性别、年龄、体重、性格四项基本属性 -->
        <div class="detail-section">
            <h3>基本信息</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">性别</div>
                    <!-- 性别值，id="detailGender" -->
                    <div class="info-value" id="detailGender">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">年龄</div>
                    <!-- 年龄值，id="detailAge" -->
                    <div class="info-value" id="detailAge">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">体重</div>
                    <!-- 体重值，id="detailWeight" -->
                    <div class="info-value" id="detailWeight">-</div>
                </div>
                <div class="info-item">
                    <div class="info-label">性格</div>
                    <!-- 性格描述值，id="detailPersonality" -->
                    <div class="info-value" id="detailPersonality">-</div>
                </div>
            </div>
        </div>

        <!-- ==================== 健康记录分区 ==================== -->
        <!-- 展示猫咪的疫苗、绝育、体检等健康相关记录 -->
        <div class="detail-section">
            <h3>健康记录</h3>
            <!-- 健康记录容器，id="healthRecords" 供 JS 动态渲染（当前版本显示暂无记录） -->
            <div id="healthRecords">
                <p style="color: #666;">暂无健康记录</p>
            </div>
        </div>

        <!-- ==================== 投喂统计分区 ==================== -->
        <!-- 展示今日投喂次数和累计投喂次数 -->
        <div class="detail-section">
            <h3>投喂统计</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="info-label">今日投喂</div>
                    <!-- 今日投喂数，id="todayFeeds" 供 JS 更新 -->
                    <div class="info-value" id="todayFeeds">0</div>
                </div>
                <div class="info-item">
                    <div class="info-label">累计投喂</div>
                    <!-- 累计投喂数，id="totalFeeds" 供 JS 更新 -->
                    <div class="info-value" id="totalFeeds">0</div>
                </div>
            </div>
        </div>

        <!-- ==================== 操作按钮区域 ==================== -->
        <div class="action-buttons">
            <!-- 投喂按钮，id="feedBtn" 供 JS 绑定点击事件 -->
            <button class="btn btn-feed" id="feedBtn">🍖 投喂</button>
            <!-- 举报异常按钮，id="reportBtn" 供 JS 绑定点击事件 -->
            <button class="btn btn-secondary" id="reportBtn">🚨 举报异常</button>
        </div>
    </div>

    <!-- ==================== Toast 提示组件 ==================== -->
    <div id="toast" class="toast"></div>

    <!-- 引入全局公共 JS -->
    <script src="/static/js/main.js?v={{ cache_bust }}"></script>
    <!-- ==================== 页面内联脚本 ==================== -->
    <script>
        // ==================== 获取 URL 参数中的猫咪 ID ====================
        // 从 URL 查询参数 ?id=xxx 中提取猫咪 ID，默认使用 'cat1'
        const urlParams = new URLSearchParams(window.location.search);
        const catId = urlParams.get('id') || 'cat1';

        // ==================== 加载猫咪详情 ====================
        // 通过 /api/cats/{catId} 获取猫咪完整数据
        async function loadCatDetail() {
            try {
                const response = await fetch(`/api/cats/${catId}`);
                const data = await response.json();
                renderDetail(data.cat);
            } catch (error) {
                showToast('加载猫咪详情失败', 'error');
            }
        }

        // ==================== 渲染详情页各字段 ====================
        // 将 API 返回的猫咪数据填充到页面各元素中
        function renderDetail(cat) {
            // 更新头像区域
            document.getElementById('detailAvatar').textContent = cat.emoji || '🐱';
            document.getElementById('detailAvatar').style.background = cat.color || '#d88da3';
            // 更新名称和位置
            document.getElementById('detailName').textContent = cat.name;
            document.getElementById('detailLocation').textContent = '📍 ' + cat.location;
            
            // 更新状态徽章：映射状态码到中文文本和 CSS 类名
            const statusMap = {
                'adoptable': { text: '可领养', class: 'status-adoptable' },
                'adopted': { text: '已领养', class: 'status-adopted' },
                'monitoring': { text: '监控中', class: 'status-monitoring' }
            };
            const status = statusMap[cat.status] || { text: cat.status, class: '' };
            const statusEl = document.getElementById('detailStatus');
            statusEl.textContent = status.text;
            // 同时更新 class，保留基础类 detail-status 并追加状态特定类
            statusEl.className = 'detail-status ' + status.class;

            // 更新基本信息字段
            document.getElementById('detailGender').textContent = cat.gender || '-';
            document.getElementById('detailAge').textContent = cat.age || '-';
            document.getElementById('detailWeight').textContent = cat.weight || '-';
            document.getElementById('detailPersonality').textContent = cat.personality || '-';
            // 更新投喂统计数据
            document.getElementById('todayFeeds').textContent = cat.today_feeds || 0;
            document.getElementById('totalFeeds').textContent = cat.total_feeds || 0;
        }

        // ==================== 投喂按钮事件 ====================
        // 向 /api/feed 发送 POST 请求进行投喂，成功后刷新详情数据
        document.getElementById('feedBtn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/feed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cat_id: catId })
                });
                
                if (response.ok) {
                    showToast('投喂成功！', 'success');
                    loadCatDetail(); // 刷新详情数据以更新投喂计数
                } else {
                    // 尝试解析后端返回的错误信息
                    const error = await response.json();
                    showToast(error.error || '投喂失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        });

        // ==================== 举报异常按钮事件 ====================
        // 弹出输入框让用户填写异常原因，提交到 /api/report-abuse
        document.getElementById('reportBtn').addEventListener('click', async () => {
            // 使用 prompt 弹窗获取用户输入的异常原因
            const reason = prompt('请输入异常原因：');
            if (!reason) return; // 用户取消则不提交
            
            try {
                const response = await fetch('/api/report-abuse', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ cat_id: catId, reason })
                });
                
                if (response.ok) {
                    showToast('举报已提交，感谢你的关注！', 'success');
                } else {
                    showToast('举报失败', 'error');
                }
            } catch (error) {
                showToast('网络错误', 'error');
            }
        });

        // ==================== 页面初始化 ====================
        loadCatDetail();
    </script>
</body>
</html>
